# AI-Powered Log Analyzer - Application Configuration

# Anthropic API key - replace with your real key (sk-ant-...)
anthropic.api.key=YOUR_API_KEY_HERE

# HTTP Server port (used when running LogAnalyzerApplication)
server.port=8080

# Application name
app.name=log-analyzer

# Logging level (INFO | DEBUG | WARN | ERROR)
log.level=INFO
